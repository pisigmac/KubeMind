[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kubemind-tracing"
version = "0.3.3"
description = "Distributed tracing and correlation ID utilities shared by every KubeMind service"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["kubemind_tracing*"]
