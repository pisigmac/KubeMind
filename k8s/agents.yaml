apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
  namespace: kubemind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agents
  template:
    metadata:
      labels:
        app: agents
    spec:
      containers:
        - name: agents
          image: pisigmac/kubemind-agents:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: kubemind-config
            - secretRef:
                name: kubemind-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: agents
  namespace: kubemind
spec:
  selector:
    app: agents
  ports:
    - port: 8082
      targetPort: 8082
