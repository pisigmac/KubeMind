apiVersion: v1
kind: Secret
metadata:
  name: kubemind-secrets
  namespace: kubemind
type: Opaque
stringData:
  postgres-password: "change-me-postgres-password"
  DATABASE_URL: "postgresql://kubemind:change-me-postgres-password@postgres:5432/kubemind"
  NEXTAUTH_SECRET: "change-me-to-random-32-byte-string"
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
