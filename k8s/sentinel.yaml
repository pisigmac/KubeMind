apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel
  namespace: kubemind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel
  template:
    metadata:
      labels:
        app: sentinel
    spec:
      containers:
        - name: sentinel
          image: pisigmac/kubemind-sentinel:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: kubemind-config
          volumeMounts:
            - name: sentinel-data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: sentinel-data
          persistentVolumeClaim:
            claimName: sentinel-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel
  namespace: kubemind
spec:
  selector:
    app: sentinel
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinel-pvc
  namespace: kubemind
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
