apiVersion: apps/v1
kind: Deployment
metadata:
  name: mind
  namespace: kubemind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mind
  template:
    metadata:
      labels:
        app: mind
    spec:
      containers:
        - name: mind
          image: pisigmac/kubemind-mind:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: kubemind-config
            - secretRef:
                name: kubemind-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: mind
  namespace: kubemind
spec:
  selector:
    app: mind
  ports:
    - port: 8081
      targetPort: 8081
