providers:
  ollama:
    base_url: "${OLLAMA_BASE_URL}"
    models: ["llama3.1", "mistral", "nomic-embed-text", "deepseek-r1"]
    priority: 1
    free: true
    timeout_seconds: 60
    local: true
  vllm:
    base_url: "${VLLM_BASE_URL}"
    models: ["meta-llama/Meta-Llama-3-8B-Instruct", "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"]
    priority: 2
    free: true
    local: true
    timeout_seconds: 60
  deepseek_local:
    base_url: "${DEEPSEEK_LOCAL_BASE_URL}"
    models: ["deepseek-r1", "deepseek-r1:7b", "deepseek-r1:14b"]
    priority: 2
    free: true
    local: true
    timeout_seconds: 120
  groq:
    api_key: "${GROQ_API_KEY}"
    base_url: "https://api.groq.com/openai/v1"
    models: ["llama-3.1-70b", "mixtral-8x7b", "llama-3.1-8b-instant"]
    priority: 3
    free: true
    rate_limit: 20
    timeout_seconds: 30
  google:
    api_key: "${GOOGLE_API_KEY}"
    models: ["gemini-1.5-flash"]
    priority: 4
    free: true
    rate_limit: 60
    timeout_seconds: 30
  openrouter:
    api_key: "${OPENROUTER_API_KEY}"
    base_url: "https://openrouter.ai/api/v1"
    models: ["meta-llama/llama-3.1-70b"]
    priority: 5
    free: true
    rate_limit: 20
    timeout_seconds: 30
  openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    models: ["gpt-4o-mini", "gpt-4o"]
    priority: 6
    free: false
    rate_limit: 100
    timeout_seconds: 30
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "${ANTHROPIC_BASE_URL}"
    models: ["claude-3-5-sonnet-20241022", "claude-3-5-haiku-20241022"]
    priority: 6
    free: false
    rate_limit: 50
    timeout_seconds: 60
    # Uses OpenAI-compatible proxy if ANTHROPIC_BASE_URL points at a compat gateway;
    # otherwise set base_url to a LiteLLM/proxy endpoint that speaks /v1/chat/completions.

# ── Authentication ───────────────────────────────────────────────
# Keys bind a caller to a workspace. With no keys configured the router runs in
# open mode and trusts X-Workspace-ID, which is fine on a laptop and not fine
# anywhere else. Prefer the KUBEMIND_API_KEYS env var over committing keys here.
auth:
  required: false
  keys: {}
  #  "${KUBEMIND_KEY_ACME}": acme

cache:
  backend: redis
  ttl_seconds: 300
  exact_match: true
  max_size_mb: 100
  semantic:
    enabled: true
    embedding_model: nomic-embed-text
    distance_threshold: 0.05
    max_entries_per_workspace: 10000
    scan_limit: 2000
    # Partitioning by intent shrinks each scan and stops a `code` prompt
    # matching a `general` one. A misclassification costs a miss, not a wrong
    # answer, and low-confidence requests read the shared bucket as well.
    partition_by_intent: true

# ── Routing ──────────────────────────────────────────────────────
routing:
  intent_enabled: true
  default_profile: general

  classifier:
    enabled: true
    # Mean of the top-k example similarities within each intent. Scoring per
    # intent rather than globally stops intents with many examples crowding out
    # intents with few.
    knn_k: 3
    # Confidence is the top-1 minus top-2 margin. Absolute similarity is a poor
    # signal because embedding spaces are anisotropic.
    #
    # 0.04 comes from `make eval-sweep` against eval/dataset.jsonl with
    # nomic-embed-text: it holds accuracy at 0.870 while dropping weighted
    # error from 4.9 to 3.5 versus 0.02. It trades three extra abstentions
    # (weight 0.3) for two fewer misroutes (weight 1.0). Re-run the sweep if
    # the embedding model changes -- these numbers are model-specific.
    margin_threshold: 0.04
    min_similarity: 0.45
    temperature: 0.05
    rule_prior_weight: 0.06
    history_decay: 0.35

  # Profiles say what a request should become, not just where it goes.
  profiles:
    general:
      pool: [ollama, groq, google]
      cache:
        enabled: true
        distance_threshold: 0.05

    code:
      pool: [deepseek_local, ollama, groq]
      temperature: 0.2
      system_prompt: >-
        You are a precise software engineer. Prefer correct, runnable code and
        state assumptions explicitly.
      cache:
        enabled: true
        # Code answers are brittle to small prompt differences, so require a
        # closer match than general chat.
        distance_threshold: 0.02

    knowledge:
      pool: [ollama, groq]
      retrieval: true
      retrieval_top_k: 4
      temperature: 0.1
      cache:
        enabled: true
        distance_threshold: 0.03

    security_local:
      # Security questions tend to carry sensitive detail. Keeping them on
      # local providers is a routing preference; the policy engine is what
      # actually enforces egress, independently of this classifier.
      pool: [ollama, vllm, deepseek_local]
      temperature: 0.1
      cache:
        enabled: false

    fast_local:
      pool: [ollama, vllm]
      temperature: 0.0
      max_tokens: 1024
      system_prompt: >-
        Summarise operational log data. Be terse and factual. Lead with the
        most likely root cause.
      cache:
        enabled: true
        distance_threshold: 0.08

  # Intents are declarative: examples build the k-NN index at startup, and each
  # maps to a profile. Add an intent by adding examples, not by writing code.
  intents:
    code:
      profile: code
      examples:
        - "Write a Python function that parses a YAML config file"
        - "Refactor this class to use dependency injection"
        - "Why does this TypeScript code throw a type error?"
        - "Implement a binary search in Go"
        - "Add unit tests for the retry helper"
        - "Explain what this regex does and rewrite it more readably"
        - "Fix the off-by-one bug in this loop"
        - "Convert this callback code to async await"

    rag:
      profile: knowledge
      examples:
        - "What does our onboarding handbook say about expenses?"
        - "According to the runbook, how do we roll back a release?"
        - "Look up our data retention policy"
        - "Search the knowledge base for the incident response process"
        - "What is our SOC2 evidence collection procedure?"
        - "Find the section of the design doc about rate limiting"
        - "Per our internal wiki, who owns the billing service?"

    security:
      profile: security_local
      examples:
        - "Review this authentication flow for vulnerabilities"
        - "Is CVE-2024-3094 relevant to our dependency tree?"
        - "Threat model this file upload endpoint"
        - "What are the risks of allowing this RBAC binding?"
        - "Check this nginx config for security hardening gaps"
        - "How should we rotate these service credentials?"

    log:
      profile: fast_local
      examples:
        - "Why is this pod in CrashLoopBackOff?"
        - "Summarize these error logs and find the root cause"
        - "What caused the spike in 500s at 14:20?"
        - "This container was OOMKilled, what should I change?"
        - "Parse this stack trace and tell me what failed"
        - "Explain these kubelet log lines"

    # Decoy class. Out-of-distribution prompts land here and are treated as
    # `general`, which stops them being forced into the nearest real intent.
    _background:
      examples:
        - "What is the weather like today?"
        - "Write a haiku about the ocean"
        - "Who won the world cup in 1998?"
        - "Translate good morning into Japanese"
        - "Give me a recipe for banana bread"
        - "What is the capital of Australia?"
        - "Tell me a joke"
        - "Summarize the plot of Hamlet"

  # Legacy single-provider mapping. Still honoured when an intent has no
  # profile, so existing configs keep routing.
  prefer_targets: {}

  # Map preferred_target strings (from /v1/route) to provider names
  target_aliases:
    deepseek-r1-local: deepseek_local
    deepseek-r1: deepseek_local
    vllm-cluster: vllm
    vllm-local: vllm
    ollama: ollama
    local: ollama

# ── Sensitivity policy ───────────────────────────────────────────
# Evaluated inline, before dispatch, independently of the intent classifier.
# Most restrictive matching rule wins.
policy:
  enabled: true
  # If the engine cannot reach a verdict, refuse rather than pass through.
  fail_closed: true
  default:
    rules:
      - detector: private_key
        action: block
      - detector: aws_key
        action: block
      - detector: api_key
        action: block
      - detector: bearer
        action: redact
      - detector: injection
        threshold: 0.6
        action: block
      # The differentiating rule: personal data may still be answered, but not
      # by a provider outside the cluster.
      - detector: any_pii
        action: local_only
  workspaces: {}

rate_limiting:
  default_requests_per_minute: 60
  default_tokens_per_minute: 10000

circuit_breaker:
  failure_threshold: 5
  recovery_timeout_seconds: 30
  half_open_max_requests: 3

usage_tracking:
  enabled: true
  flush_interval_seconds: 60
