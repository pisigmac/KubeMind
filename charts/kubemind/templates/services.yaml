{{- $root := . -}}
{{- range $name, $port := dict "router" 8080 "mind" 8081 "agents" 8082 "sentinel" 8083 "dashboard" 3000 }}
{{- if gt (int (index $root.Values.replicas $name)) 0 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubemind.name" $root }}-{{ $name }}
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- include "kubemind.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ index $root.Values.replicas $name }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ $name }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        {{- include "kubemind.labels" $root | nindent 8 }}
      annotations:
        prometheus.io/scrape: {{ if or (eq $name "router") (eq $name "sentinel") }}"true"{{ else }}"false"{{ end }}
        prometheus.io/port: "{{ $port }}"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: {{ $name }}
          image: {{ index $root.Values.image $name }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $port }}
          envFrom:
            - configMapRef:
                name: {{ include "kubemind.name" $root }}-config
            - secretRef:
                name: {{ include "kubemind.name" $root }}-secrets
          env:
            - name: PORT
              value: "{{ $port }}"
            {{- if eq $name "router" }}
            - name: OLLAMA_BASE_URL
              value: {{ if $root.Values.ollama.enabled }}http://{{ include "kubemind.name" $root }}-ollama:11434{{ else }}http://host.docker.internal:11434{{ end }}
            {{- end }}
          resources:
            {{- toYaml (index $root.Values.resources $name) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ if eq $name "dashboard" }}/{{ else }}/health{{ end }}
              port: {{ $port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ if eq $name "dashboard" }}/{{ else }}/health{{ end }}
              port: {{ $port }}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubemind.name" $root }}-{{ $name }}
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- include "kubemind.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: {{ $root.Values.service.type }}
  selector:
    app.kubernetes.io/component: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - port: {{ $port }}
      targetPort: {{ $port }}
      name: http
{{- end }}
{{- end }}
