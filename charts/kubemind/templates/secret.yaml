apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubemind.name" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "kubemind.databaseUrl" . | quote }}
  REDIS_URL: {{ include "kubemind.redisUrl" . | quote }}
  AUDIT_LEDGER_URL: {{ include "kubemind.databaseUrl" . | quote }}
  KUBEMIND_API_KEYS: {{ .Values.auth.apiKeys | quote }}
  KUBEMIND_SERVICE_KEY: {{ .Values.auth.serviceKey | quote }}
  KUBEMIND_ADMIN_KEY: {{ .Values.auth.adminKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
