{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kubemind.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubemind.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubemind.name" . }}-router
                port:
                  number: 8080
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: {{ include "kubemind.name" . }}-router
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kubemind.name" . }}-dashboard
                port:
                  number: 3000
{{- end }}
