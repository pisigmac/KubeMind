name: KubeMind CI

on:
  pull_request:
  push:
    branches: [dev, master, main]

permissions:
  contents: read

concurrency:
  group: kubemind-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/kmind/go.mod
          cache-dependency-path: cmd/kmind/go.sum
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install --requirement requirements-dev.txt
          python -m pip install -e shared/python/kubemind_config
          python -m pip install -e shared/python/kubemind_auth
          python -m pip install -e shared/python/kubemind_policy
          python -m pip install -e shared/python/kubemind_tracing
          python -m pip install --requirement services/router/requirements.txt
          python -m pip install --requirement services/mind/requirements.txt
          python -m pip install --requirement services/agents/requirements.txt
          python -m pip install --requirement services/sentinel/requirements.txt
          
      - name: Run Backend Tests
        run: make test
        
      - name: Build TypeScript SDK
        run: |
          cd sdk/typescript
          npm install
          npm run build
          
      - name: Validate Python SDK Package
        run: |
          cd sdk/python
          python3 -m build --sdist --wheel .
          
      - name: Build Dashboard
        run: |
          cd dashboard
          npm install
          npm run build
          
      - name: Compile kmind CLI
        run: make cli
