name: KubeMind CI

on:
  pull_request:
  push:
    branches: [dev, master, main]

permissions:
  contents: read

concurrency:
  group: kubemind-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/tricore/go.mod
          cache-dependency-path: cmd/tricore/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --requirement services/router/requirements.txt --requirement services/mind/requirements.txt --requirement services/agents/requirements.txt --requirement services/sentinel/requirements.txt
      - run: npm ci
        working-directory: dashboard
      - run: make ci
