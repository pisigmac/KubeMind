[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubemind-sdk"
version = "0.1.0"
description = "Official Python client SDK for KubeMind AI Gateway and Governance Control Plane"
readme = "README.md"
authors = [{ name = "KubeMind Team", email = "maintainers@kubemind.io" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.23.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://kubemind.io"
Documentation = "https://kubemind.io/docs"
Repository = "https://github.com/kubemind/kubemind"
