[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubemind"
version = "0.1.2"
description = "Official Python client SDK for KubeMind AI Gateway and Governance Control Plane"
readme = "README.md"
authors = [{ name = "Vikas Budde", email = "vikas.budde@hotmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.23.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/pisigmac/kubemind"
Documentation = "https://raw.githubusercontent.com/pisigmac/KubeMind/refs/heads/master/README.md"
Repository = "https://github.com/pisigmac/kubemind"
